# Baseline CI for claude-md-ab. Actions are SHA-pinned to match the other portfolio repos.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python-version: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q --cov=summarize --cov=scripts --cov-report=term-missing --cov-fail-under=90
      - name: shellcheck
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck run_ab.sh .cursor/hooks/*.sh
  receipts:
    # Recompute every published number that the committed artifacts can support.
    # Map size (~190), the 450:1 leverage, capn-hook's 77%, and the follow-up
    # pilot (0.84 / 0.50 / 4/12) are printed as UNVERIFIED and do not fail the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_receipts.py
  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Company-name hits inside results/ are pre-existing saved answers (one subject
      # repo described itself that way). Those artifacts are not rewritten. The
      # company-name pattern is not applied to results/; export-control markers still are.
      # .cursor, AGENTS.md, and .github state the prohibition and would match themselves.
      - name: Block employer / export-control markers and committed build junk
        run: |
          ! git grep -nIiE 'lockheed|\blmco\b' -- . ':!.cursor' ':!AGENTS.md' ':!.github' ':!results'
          ! git grep -nIiE '\bCUI\b|ITAR|EXPORT CONTROLLED|PROPRIETARY' -- . ':!.cursor' ':!AGENTS.md' ':!.github'
          ! git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)'
