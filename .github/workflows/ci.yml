# Baseline CI for claude-md-ab. Actions are SHA-pinned to match the other portfolio repos.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python-version: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q --cov=summarize --cov=scripts --cov-report=term-missing --cov-fail-under=90
      - name: shellcheck
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck run_ab.sh .cursor/hooks/*.sh
  receipts:
    # Recompute every published number that the committed artifacts can support.
    # Map size (~190), the 450:1 leverage, capn-hook's 77%, and the follow-up
    # pilot (0.84 / 0.50 / 4/12) are printed as UNVERIFIED and do not fail the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python3 scripts/check_receipts.py
  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # Employer terms live only as SHA-256 digests in .github/blocked-terms.sha256.
      # The scanner covers every tracked file (results/ included) and exits non-zero
      # if the digest file is missing, empty, or malformed, with or without the
      # optional EMPLOYER_MARKERS secret (an extra regex; never a substitute).
      - name: Block hashed employer terms (whole tree)
        env:
          EMPLOYER_MARKERS: ${{ secrets.EMPLOYER_MARKERS }}
        run: python3 scripts/scan_blocked_terms.py
      # .cursor, AGENTS.md, and .github state the export-control prohibition and would match themselves.
      - name: Block export-control markers and committed build junk
        run: |
          ! git grep -nIiE '\bCUI\b|ITAR|EXPORT CONTROLLED|PROPRIETARY' -- . ':!.cursor' ':!AGENTS.md' ':!.github'
          ! git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)'
